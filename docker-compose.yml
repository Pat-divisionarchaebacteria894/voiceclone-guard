version: "3.9"

services:
  backend:
    build: ./backend
    container_name: voiceguard-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - voiceguard-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/voiceguard.db
      - UPLOAD_DIR=/app/data/uploads
      - MODEL_CACHE_DIR=/app/data/models
      - USE_TRANSFORMER_MODEL=${USE_TRANSFORMER_MODEL:-false}
      - HF_MODEL_ID=${HF_MODEL_ID:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-25}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: voiceguard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  voiceguard-data:
